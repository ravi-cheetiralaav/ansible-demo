---
- name: Require Debian 13 amd64
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
      - ansible_distribution_major_version == '13'
      - ansible_architecture == 'x86_64'
    fail_msg: This role requires Debian 13 amd64 packages.

- name: Install Artifact Registry repository signing key
  ansible.builtin.get_url:
    url: https://{{ postgresql_gar_location }}-apt.pkg.dev/doc/repo-signing-key.gpg
    dest: /etc/apt/trusted.gpg.d/artifact-registry.gpg
    owner: root
    group: root
    mode: '0644'

- name: Install Artifact Registry APT credential helper
  ansible.builtin.apt:
    name: apt-transport-artifact-registry
    state: present
    update_cache: true

- name: Configure PostgreSQL Artifact Registry repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/postgres-artifact-registry.list
    content: >
      deb [signed-by=/etc/apt/trusted.gpg.d/artifact-registry.gpg]
      ar+https://{{ postgresql_gar_location }}-apt.pkg.dev/projects/{{ postgresql_gar_project }}
      {{ postgresql_gar_repository }} main
    owner: root
    group: root
    mode: '0644'

- name: Install PostgreSQL 17 packages
  ansible.builtin.apt:
    name: '{{ postgresql_packages }}'
    state: present
    update_cache: true

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Query the running PostgreSQL server version
  ansible.builtin.command:
    argv:
      - /usr/sbin/runuser
      - -u
      - postgres
      - --
      - /usr/bin/psql
      - -X
      - -A
      - -t
      - -d
      - postgres
      - -c
      - SHOW server_version_num
  register: postgresql_server_version
  changed_when: false
  until: postgresql_server_version.rc == 0
  retries: 5
  delay: 2

- name: Verify PostgreSQL 17 is serving local connections
  ansible.builtin.assert:
    that:
      - postgresql_server_version.stdout | int // 10000 == 17
    fail_msg: 'Expected PostgreSQL 17, got server_version_num={{ postgresql_server_version.stdout }}'