---
- name: Require Debian 13 amd64
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
      - ansible_distribution_major_version == '13'
      - ansible_architecture == 'x86_64'
    fail_msg: This role requires Debian 13 amd64 packages.

- name: Require JFrog repository settings
  ansible.builtin.assert:
    that:
      - postgresql_jfrog_url is match('^https://[^/]+/artifactory/[^/]+/?$')
      - postgresql_jfrog_signing_key_url is match('^https://')
      - postgresql_jfrog_signing_key_url | regex_search('^https://[^/]+') == postgresql_jfrog_url | regex_search('^https://[^/]+')
      - postgresql_jfrog_user | length > 0
      - postgresql_jfrog_token | length > 0
    fail_msg: Set JFROG_DEB_REPO_URL, JFROG_DEB_SIGNING_KEY_URL, JFROG_USER, and JFROG_ACCESS_TOKEN on the Ansible controller.
  no_log: true

- name: Remove old Artifact Registry APT source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/postgres-artifact-registry.list
    state: absent

- name: Remove old Artifact Registry signing key
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/artifact-registry.gpg
    state: absent

- name: Configure JFrog APT credentials
  ansible.builtin.copy:
    dest: /etc/apt/auth.conf.d/postgresql-jfrog.conf
    content: |
      machine {{ postgresql_jfrog_url | regex_replace('^https://', '') }}
      login {{ postgresql_jfrog_user }}
      password {{ postgresql_jfrog_token }}
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Install JFrog repository signing key
  ansible.builtin.get_url:
    url: '{{ postgresql_jfrog_signing_key_url }}'
    dest: /usr/share/keyrings/postgresql-jfrog.asc
    url_username: '{{ postgresql_jfrog_user }}'
    url_password: '{{ postgresql_jfrog_token }}'
    force_basic_auth: true
    owner: root
    group: root
    mode: '0644'
  no_log: true

- name: Configure PostgreSQL JFrog repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/postgresql-jfrog.list
    content: >
      deb [signed-by=/usr/share/keyrings/postgresql-jfrog.asc]
      {{ postgresql_jfrog_url }} trixie main
    owner: root
    group: root
    mode: '0644'

- name: Install PostgreSQL 17 packages
  ansible.builtin.apt:
    name: '{{ postgresql_packages }}'
    state: present
    update_cache: true

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started

- name: Query the running PostgreSQL server version
  ansible.builtin.command:
    argv:
      - /usr/sbin/runuser
      - -u
      - postgres
      - --
      - /usr/bin/psql
      - -X
      - -A
      - -t
      - -d
      - postgres
      - -c
      - SHOW server_version_num
  register: postgresql_server_version
  changed_when: false
  until: postgresql_server_version.rc == 0
  retries: 5
  delay: 2

- name: Verify PostgreSQL 17 is serving local connections
  ansible.builtin.assert:
    that:
      - postgresql_server_version.stdout | int // 10000 == 17
    fail_msg: 'Expected PostgreSQL 17, got server_version_num={{ postgresql_server_version.stdout }}'