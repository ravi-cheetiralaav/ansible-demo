---
postgresql_jfrog_url: "{{ lookup('ansible.builtin.env', 'JFROG_DEB_REPO_URL') }}"
postgresql_jfrog_signing_key_url: "{{ lookup('ansible.builtin.env', 'JFROG_DEB_SIGNING_KEY_URL') }}"
postgresql_jfrog_user: "{{ lookup('ansible.builtin.env', 'JFROG_USER') }}"
postgresql_jfrog_token: "{{ lookup('ansible.builtin.env', 'JFROG_ACCESS_TOKEN') }}"
postgresql_packages:
  - postgresql-client-common=293.pgdg13+1
  - postgresql-common=293.pgdg13+1
  - libpq5=18.6-1.pgdg13+2
  - postgresql-client-17=17.11-1.pgdg13+2
  - postgresql-17=17.11-1.pgdg13+2
